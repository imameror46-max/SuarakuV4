name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q '*.zip'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: git clone --depth 1 https://github.com/mmorise/World.git SuaraKu/app/src/main/cpp/World
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: SuaraKu
      - uses: actions/upload-artifact@v4
        with:
          name: SuaraKu-debug-apk
          path: SuaraKu/app/build/outputs/apk/debug/*.apk
